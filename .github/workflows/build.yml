name: Build Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout our code
        uses: actions/checkout@v4
        with:
          path: our_code

      - name: Download Android Template
        run: |
          git clone --depth 1 https://github.com/android/compose-samples.git temp_repo
          cp -r temp_repo/JetNews/* .
          rm -rf temp_repo

      # 这里我们要修改一下模板的配置，让它能识别我们的包名
      - name: Inject our code
        run: |
          # 覆盖主代码
          rm -rf app/src/main/java/com/example/jetnews
          mkdir -p app/src/main/java/com/example/miuitimeapp
          cp -r our_code/app/src/main/java/com/example/miuitimeapp/* app/src/main/java/com/example/miuitimeapp/
          cp our_code/app/src/main/AndroidManifest.xml app/src/main/AndroidManifest.xml
          
          # 修改模板的 build.gradle.kts，替换包名并加上正式版签名配置
          sed -i 's/com.example.jetnews/com.example.miuitimeapp/g' app/build.gradle.kts
          
          # 自动生成签名并添加到配置中
          keytool -genkey -v -keystore release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias key0 -storepass 123456 -keypass 123456 -dname "CN=Android, OU=Android, O=Android, L=Android, ST=Android, C=US"
          
          cat << 'EOF' >> app/build.gradle.kts

          android {
              signingConfigs {
                  create("release") {
                      storeFile = file("../release.jks")
                      storePassword = "123456"
                      keyAlias = "key0"
                      keyPassword = "123456"
                  }
              }
              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("release")
                      isMinifyEnabled = false
                  }
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: MiuiTimeApp-Release
          path: app/build/outputs/apk/release/app-release.apk
