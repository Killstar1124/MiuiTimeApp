name: Build Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout our code
        uses: actions/checkout@v4
        with:
          path: our_code

      - name: Download Android Template
        run: |
          git clone --depth 1 https://github.com/android/compose-samples.git temp_repo
          cp -r temp_repo/JetNews/* .
          rm -rf temp_repo

      - name: Inject our code
        run: |
          rm -rf app/src/main/java/com/example/jetnews
          mkdir -p app/src/main/java/com/example/miuitimeapp
          cp -r our_code/app/src/main/java/com/example/miuitimeapp/* app/src/main/java/com/example/miuitimeapp/
          cp our_code/app/src/main/AndroidManifest.xml app/src/main/AndroidManifest.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 【核心：自动生成签名文件】
      - name: Generate Keystore and sign APK
        run: |
          # 自动生成一个有效期10000天的签名（密码设为 123456）
          keytool -genkey -v -keystore my-release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias my-alias -storepass 123456 -keypass 123456 -dname "CN=Android, OU=Android, O=Android, L=Android, ST=Android, C=US"
          
          # 把签名配置写入到 app/build.gradle.kts 中
          echo '
          android {
              signingConfigs {
                  create("release") {
                      storeFile = file("../my-release-key.jks")
                      storePassword = "123456"
                      keyAlias = "my-alias"
                      keyPassword = "123456"
                  }
              }
              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          }
          ' >> app/build.gradle.kts

      # 【正式版打包命令：assembleRelease】
      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: MiuiTimeApp-Release
          # 注意：正式包叫 app-release.apk
          path: app/build/outputs/apk/release/app-release.apk