name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 核心步骤：解压你的项目压缩包
      - name: Unzip Project
        run: |
          unzip MiuiTimeApp-AndroidStudio.zip -d extracted_app
          # 查找 gradlew 文件所在的真实根目录，并移动出来
          PROJECT_ROOT=$(find extracted_app -name "gradlew" -exec dirname {} \; | head -n 1)
          echo "找到项目根目录: $PROJECT_ROOT"
          mv $PROJECT_ROOT/* .
          mv $PROJECT_ROOT/.* . 2>/dev/null || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: MiuiTimeApp-APK
          path: app/build/outputs/apk/debug/app-debug.apk